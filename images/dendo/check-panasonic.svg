<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="cpTitle">
  <title id="cpTitle">Panasonic製バッテリーの残量ボタンとランプ表示の図解</title>
  <rect width="800" height="460" fill="#FCFCFB"/>
  <text x="60" y="60" font-family="sans-serif" font-size="20" font-weight="700" fill="#191C1A">Panasonic の場合（図解イメージ）</text>
  <!-- 縦長バッテリー -->
  <rect x="90" y="100" width="180" height="300" rx="20" fill="#EAEAE5" stroke="#191C1A" stroke-opacity="0.25" stroke-width="2"/>
  <!-- ランプ列（縦） -->
  <circle cx="150" cy="150" r="9" fill="#43A047"/>
  <circle cx="150" cy="185" r="9" fill="#43A047"/>
  <circle cx="150" cy="220" r="9" fill="#43A047"/>
  <circle cx="150" cy="255" r="9" fill="#43A047" opacity="0.35"/>
  <circle cx="150" cy="290" r="9" fill="#43A047" opacity="0.35"/>
  <!-- 残量ボタン -->
  <circle cx="215" cy="345" r="26" fill="#FCFCFB" stroke="#2E7D50" stroke-width="4"/>
  <circle cx="215" cy="345" r="40" fill="none" stroke="#2E7D50" stroke-width="2" opacity="0.4"/>
  <line x1="255" y1="345" x2="380" y2="345" stroke="#2E7D50" stroke-width="2"/>
  <text x="395" y="352" font-family="sans-serif" font-size="17" font-weight="700" fill="#245F3E">残容量表示ボタンを長押し</text>
  <line x1="170" y1="220" x2="380" y2="220" stroke="#191C1A" stroke-opacity="0.3" stroke-width="2"/>
  <text x="395" y="215" font-family="sans-serif" font-size="17" fill="#191C1A" opacity="0.75">ランプの点灯・点滅パターンが</text>
  <text x="395" y="243" font-family="sans-serif" font-size="17" fill="#191C1A" opacity="0.75">実容量（劣化度）の表示に切り替わる</text>
  <text x="60" y="435" font-family="sans-serif" font-size="14" fill="#191C1A" opacity="0.45">※ ボタンの位置・押す秒数・表示のしかたは機種により異なります。取扱説明書もあわせてご確認ください。</text>
</svg>
