<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="cbTitle">
  <title id="cbTitle">ブリヂストン製バッテリーの残量ボタンとランプ表示の図解（実写に差し替え予定）</title>
  <rect width="800" height="460" fill="#FCFCFB"/>
  <text x="60" y="60" font-family="sans-serif" font-size="20" font-weight="700" fill="#191C1A">ブリヂストン（Bridgestone）の場合（図解イメージ）</text>
  <!-- 横長バッテリー -->
  <rect x="90" y="140" width="340" height="180" rx="20" fill="#EAEAE5" stroke="#191C1A" stroke-opacity="0.25" stroke-width="2"/>
  <!-- ランプ列（横） -->
  <circle cx="150" cy="200" r="10" fill="#43A047"/>
  <circle cx="195" cy="200" r="10" fill="#43A047"/>
  <circle cx="240" cy="200" r="10" fill="#43A047"/>
  <circle cx="285" cy="200" r="10" fill="#43A047" opacity="0.35"/>
  <!-- 残量ボタン -->
  <circle cx="370" cy="260" r="26" fill="#FCFCFB" stroke="#2E7D50" stroke-width="4"/>
  <circle cx="370" cy="260" r="40" fill="none" stroke="#2E7D50" stroke-width="2" opacity="0.4"/>
  <line x1="410" y1="260" x2="500" y2="260" stroke="#2E7D50" stroke-width="2"/>
  <text x="510" y="267" font-family="sans-serif" font-size="17" font-weight="700" fill="#245F3E">残量ボタンを長押し</text>
  <line x1="285" y1="185" x2="500" y2="160" stroke="#191C1A" stroke-opacity="0.3" stroke-width="2"/>
  <text x="510" y="155" font-family="sans-serif" font-size="17" fill="#191C1A" opacity="0.75">点灯・点滅パターンが</text>
  <text x="510" y="183" font-family="sans-serif" font-size="17" fill="#191C1A" opacity="0.75">実容量（劣化度）の表示に</text>
  <text x="60" y="435" font-family="sans-serif" font-size="14" fill="#191C1A" opacity="0.45">※ 駆動方式（ヤマハ系ユニット / 両輪駆動系）により手順が異なる場合があります。実写画像を順次掲載します。</text>
</svg>
