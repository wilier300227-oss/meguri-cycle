<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="cbTitle">
  <title id="cbTitle">ブリヂストン製バッテリーの残量ボタンとランプ表示の図解（実写に差し替え予定）</title>
  <rect width="800" height="460" fill="#FCFCFB"/>
  <text x="60" y="60" font-family="sans-serif" font-size="20" font-weight="700" fill="#191C1A">ブリヂストン（Bridgestone）の場合（図解イメージ）</text>
  <!-- 縦長バッテリー（実物はフレーム縦付けの縦型パックのため。2026-09-13修正） -->
  <rect x="90" y="100" width="180" height="300" rx="20" fill="#EAEAE5" stroke="#191C1A" stroke-opacity="0.25" stroke-width="2"/>
  <text x="180" y="128" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#191C1A" opacity="0.55">バッテリー本体</text>
  <!-- ランプ列（縦4灯） -->
  <circle cx="150" cy="160" r="10" fill="#43A047"/>
  <circle cx="150" cy="200" r="10" fill="#43A047"/>
  <circle cx="150" cy="240" r="10" fill="#43A047" opacity="0.35"/>
  <circle cx="150" cy="280" r="10" fill="#43A047" opacity="0.35"/>
  <!-- 残量ボタン -->
  <circle cx="215" cy="345" r="26" fill="#FCFCFB" stroke="#2E7D50" stroke-width="4"/>
  <circle cx="215" cy="345" r="40" fill="none" stroke="#2E7D50" stroke-width="2" opacity="0.4"/>
  <line x1="255" y1="345" x2="380" y2="345" stroke="#2E7D50" stroke-width="2"/>
  <text x="395" y="352" font-family="sans-serif" font-size="17" font-weight="700" fill="#245F3E">残量ボタンを長押し</text>
  <line x1="170" y1="220" x2="380" y2="220" stroke="#191C1A" stroke-opacity="0.3" stroke-width="2"/>
  <text x="395" y="215" font-family="sans-serif" font-size="17" fill="#191C1A" opacity="0.75">点灯・点滅パターンが</text>
  <text x="395" y="243" font-family="sans-serif" font-size="17" fill="#191C1A" opacity="0.75">実容量（劣化度）の表示に</text>
  <text x="60" y="435" font-family="sans-serif" font-size="14" fill="#191C1A" opacity="0.45">※ 駆動方式（ヤマハ系ユニット / 両輪駆動系）により手順が異なる場合があります。実写画像を順次掲載します。</text>
</svg>
